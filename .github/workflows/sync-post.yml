name: Sync Post

# Controls when the workflow will run
on:
  # schedule:
  #   - cron: "30 1 * * *"
  # https://docs.github.com/cn/developers/webhooks-and-events/events/issue-event-types
  issues:
    types:
      - opened
      - closed
      - edited
      - labeled
      - unlabeled
      - reopened
  workflow_dispatch:

# Avoid overlapping runs when multiple issue events happen in quick
# succession (e.g., labeling and editing) to prevent duplicate CI
# executions for the same trigger.
concurrency:
  group: sync-post-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true
env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  GH_USER: ${{ secrets.GH_USER }}
  GH_PROJECT_NAME: ${{ secrets.GH_PROJECT_NAME }}
jobs:
  Publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v2

      - name: Setup Node.js 🚀
        uses: actions/setup-node@v3
        with:
          node-version: '20.11.0' # 指定具体的版本号

      - name: Git config 🔧
        run: |
          git config --global user.name "coderPerseus"
          git config --global user.email "snailrun160@gmail.com"

      - name: Display runtime info ✨
        run: |
          echo '当前目录：'
          pwd
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.6.0 # 或者您想要使用的 pnpm 版本

      - name: Install 🔧
        run: pnpm install

      # - name: Build ⛏️
      #   run: pnpm run build

      - name: Update blog files ⛏️
        run: |
          pnpm run sync-post
          git add .
          if git diff --staged --quiet; then
            echo 'No blog content changes to commit.'
          else
            git commit -m 'chore(ci): blog sync'
          fi

      - name: Pull latest changes from remote
        run: git pull --rebase origin main

      - name: Push changes to remote
        run: git push

      - name: Trigger blog-astro sync and deploy
        run: |
          gh api --method POST repos/coderPerseus/blog-astro/dispatches \
            -f event_type=blog-issues-updated
